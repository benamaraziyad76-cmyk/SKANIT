<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Pro - Expérience Waow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #03050a;
            --text: #ffffff;
            --accent: #ff007a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --surface: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, transparent 50%);
        }

        [data-theme="light"] {
            --bg: #f8faff;
            --text: #03050a;
            --glass: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.08);
            --surface: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
            /* Hide default cursor to use custom one */
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            filter: blur(100px);
            opacity: 0.2;
            border-radius: 50%;
            animation: move 25s infinite alternate ease-in-out;
        }

        .blob-2 {
            position: absolute;
            right: -10%;
            bottom: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.15;
            animation: move 18s infinite alternate-reverse ease-in-out;
        }

        @keyframes move {
            from {
                transform: translate(-20%, -20%) scale(1);
            }

            to {
                transform: translate(30%, 30%) scale(1.3);
            }
        }

        /* Glass Surface */
        .glass-surface {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--surface);
            background-position: var(--x, 50%) var(--y, 50%);
            background-repeat: no-repeat;
            background-size: 1000px 1000px;
            z-index: -1;
            pointer-events: none;
        }

        /* Custom Cursor */
        .cursor-glow {
            width: 400px;
            height: 400px;
            position: fixed;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .cursor-point {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 101;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }

        /* Main Content */
        .content-card {
            padding: 4rem 6rem;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 60px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .title-wrapper {
            position: relative;
            transform-style: preserve-3d;
        }

        .title {
            font-size: 10rem;
            font-weight: 900;
            letter-spacing: -5px;
            color: var(--text);
            text-transform: uppercase;
            line-height: 0.8;
            transform: translateZ(100px);
            text-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .title-back {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-50px);
            font-size: 12rem;
            font-weight: 900;
            color: var(--primary);
            opacity: 0.1;
            filter: blur(20px);
            user-select: none;
            pointer-events: none;
        }

        .badge {
            padding: 0.6rem 1.8rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transform: translateZ(50px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
        }

        /* Shimmer Effect */
        .shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.4),
                    transparent);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        /* Interactive Elements */
        .controls {
            position: fixed;
            bottom: 40px;
            display: flex;
            gap: 20px;
            opacity: 0.6;
        }

        .control-bubble {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: all;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: var(--text);
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="themeToggle" title="Changer de thème">
        <svg id="themeIcon" viewBox="0 0 24 24">
            <path
                d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
        </svg>
    </button>

    <div class="ambient-bg">
        <div class="blob"></div>
        <div class="blob-2"></div>
    </div>

    <div class="glass-surface"></div>

    <div class="cursor-glow" id="glow"></div>
    <div class="cursor-point" id="point"></div>

    <div class="content-card" id="card">
        <div class="badge">Expérience Waow</div>
        <div class="title-wrapper">
            <h1 class="title">TESTE</h1>
            <div class="title-back">TESTE</div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const glow = document.getElementById('glow');
        const point = document.getElementById('point');
        const surface = document.querySelector('.glass-surface');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Mouse interaction
        document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;

            // Cursor update
            glow.style.left = clientX + 'px';
            glow.style.top = clientY + 'px';
            point.style.left = clientX + 'px';
            point.style.top = clientY + 'px';

            // Surface lighting
            surface.style.setProperty('--x', (clientX - 500) + 'px');
            surface.style.setProperty('--y', (clientY - 500) + 'px');

            // Card Tilt
            const xRotation = (clientY - window.innerHeight / 2) / -30;
            const yRotation = (clientX - window.innerWidth / 2) / 30;

            card.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
        });

        // Theme Toggle Logic
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', targetTheme);

            // Update Icon
            if (targetTheme === 'light') {
                themeIcon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />';
            } else {
                themeIcon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />';
            }
        });

        // Click interaction
        document.addEventListener('mousedown', () => {
            glow.style.width = '600px';
            glow.style.height = '600px';
            card.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.transform += ' scale(0.9)';
        });

        document.addEventListener('mouseup', () => {
            glow.style.width = '400px';
            glow.style.height = '400px';
            card.style.transform = card.style.transform.replace(' scale(0.9)', '');
        });
    </script>
</body>

</html>
